<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diaspora East Cinema — Yinuo Xuanyuan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">

<body class="page-works">

  <header class="site-header">
    <div class="site-id">
      <a class="site-name" href="index.html">Yinuo Xuanyuan</a>
    </div>
    <nav class="site-nav">
      <a href="works.html" aria-current="page">Works</a>
      <a href="info.html">Info</a>
    </nav>
  </header>

  <main>
    <section class="work-text">
      <h1>Diaspora East Cinema, Visual Identity</h1>
      <p>Visual identity for Diaspora East Cinema, drawing on Du Fu’s Tang Dynasty poem <em class="poem-title">Twin Swallows 双燕</em>.</p>
    </section>

    <section class="stills diaspora-set">
      <!-- logo 和品牌手册：一次显示一张，点击或左右滑动看下一张 -->
      <figure class="slider-wrap logo-set">
        <div class="slider" tabindex="0" aria-label="Logo and brand guidelines, click or swipe for the next one">
          <img src="assets/web/diaspora-east-cinema-logo.jpg" alt="Diaspora East Cinema — visual identity">
          <img src="assets/web/diaspora-east-cinema-manual-2.jpg" alt="Diaspora East Cinema brand guidelines — construction drawing of the logo on a grid">
          <img loading="lazy" src="assets/web/diaspora-east-cinema-manual-3.jpg" alt="Diaspora East Cinema brand guidelines — clear space around the logo">
          <img loading="lazy" src="assets/web/diaspora-east-cinema-manual-4.jpg" alt="Diaspora East Cinema brand guidelines — colour palette: Swallow Green, Mud Magenta, Rice Paper">
          <img loading="lazy" src="assets/web/diaspora-east-cinema-manual-5.jpg" alt="Diaspora East Cinema brand guidelines — colour versions of the logo">
          <img loading="lazy" src="assets/web/diaspora-east-cinema-manual-6.jpg" alt="Diaspora East Cinema brand guidelines — logo sizes">
        </div>
        <figcaption class="slider-count">1 / 6</figcaption>
      </figure>
      <!-- 杯子照片：一次显示一张，点击或左右滑动看下一张 -->
      <figure class="slider-wrap">
        <div class="slider" tabindex="0" aria-label="Glasses with the logo, click or swipe for the next one">
          <img loading="lazy" src="assets/web/diaspora-east-cinema-cup-2.jpg" alt="Wine glasses printed with the Diaspora East Cinema logo">
          <img loading="lazy" src="assets/web/diaspora-east-cinema-cup.jpg" data-dark="0.45-1" alt="Iced coffee in a glass printed with the Diaspora East Cinema logo">
        </div>
        <figcaption class="slider-count">1 / 2</figcaption>
      </figure>
    </section>
  </main>

  <script src="nav-contrast.js"></script>
  <script src="still-slider.js"></script>
